# /home/zdy/Project2/config.yaml

# --------------------------
# General Project Settings
# --------------------------
# Project root directory, used as the base for all other relative paths.
# '.' means the project root is the same directory as this config file.
project_base_dir: '.'

# -------------------------------------
# Multiprocessing Settings
# -------------------------------------
multiprocessing:
  num_workers: 70   # Number of worker processes. null defaults to os.cpu_count().
  chunk_size: 10    # Chunksize for multiprocessing Pool operations.

# --------------------------
# Data Preprocessing Pipeline
# --------------------------

# --- 1. Protein Preparation (PDB -> PDBQT) ---
protein_preparation:
  skip_if_exists: false
  output_base_dir: "data/processed_data/predocking"
  output_filename_template: "{pdb_id}_protein.pdbqt"
  sources:
    - name: "PDBbind_v2020"
      input_dir: "data/PDBbind_v2020"
      file_glob_pattern: "**/*_prot/*_p.pdb"
      pdb_id_regex: "([a-zA-Z0-9]{4})_p\\.pdb"
    - name: "CASF_v2016"
      input_dir: "data/CASF_v2016"
      file_glob_pattern: "**/*_protein.pdb"
      pdb_id_regex: "/([a-zA-Z0-9]{4})/"

# --- 2. Drug Preparation (SDF -> PDBQT) ---
drug_preparation:
  skip_if_exists: false
  charge_model: "gasteiger"
  output_base_dir: "data/processed_data/predocking"
  output_filename_template: "{pdb_id}_ligand.pdbqt"
  sources:
    - name: "PDBbind_v2020"
      input_dir: "data/PDBbind_v2020"
    - name: "CASF_v2016"
      input_dir: "data/CASF_v2016"

# --- 3. Vina Docking (PDBQTs -> PDBQT Complex) ---
docking_input:
  data_path: "data/processed_data/predocking"
  receptor_suffix: "_protein.pdbqt"
  ligand_suffix: "_ligand.pdbqt"
  skip_if_exists: true

# --- 4. Splitting (Complex -> Backbone/Sidechain/Ligand) ---
split_task:
  base_processing_dir: "data/processed_data/predocking"
  protein_source:
    base_path: "data/PDBbind_v2020"
    subfolder_template: "{pdb_id}/{pdb_id}_prot"
    file_template: "{pdb_id}_p.pdb"
  ligand_source:
    base_path: "data/processed_data/predocking"
    subfolder_template: "{pdb_id}"
    file_template: "{pdb_id}.pdbqt"
  output_dir: "data/processed_data/split"
  backbone_suffix: "_backbone.pdb"
  sidechain_suffix: "_sidechain.pdb"
  ligand_suffix: "_ligand.sdf"

# --- 5. Lennard-Jones Matrix Generation ---
lj_generation_task:
  overwrite_existing: false
  input_dir: "data/processed_data/split"
  output_dir: "data/processed_data/LJ"
  backbone_suffix: "_backbone.pdb"
  sidechain_suffix: "_sidechain.pdb"
  ligand_suffix: "_ligand.sdf"
  use_gpu: true
  gpu_device_id: 0
  lj_params:
    'C': [3.4, 0.12]
    'N': [3.1, 0.16]
    'O': [3.0, 0.20]
    'S': [3.6, 0.25]
    'F': [3.0, 0.09]
    'CL': [3.5, 0.30]
    'BR': [3.7, 0.35]
    'P': [3.8, 0.20]
    'I': [3.9, 0.40]
  default_lj_params: [3.5, 0.1]

# --- 6. Physics/Geometry Label Generation ---
phy_geo_task:
  overwrite_existing: false
  output_dir: "data/processed_data/label"
  initial_structure_dir: "data/processed_data/split"
  split_file_templates:
    backbone_suffix: "_backbone.pdb"
    sidechain_suffix: "_sidechain.pdb"
    ligand_suffix: "_ligand.sdf"
  fallback_noise_scale: 1.0
  data_sources:
    - name: "PDBbind_v2020"
      type: "maegz_complex"
      input_dir: "data/PDBbind_v2020"
      file_pattern: "*/*_complex.maegz"
    - name: "CASF_v2016"
      type: "pdb_sdf_pair"
      input_dir: "data/CASF_v2016"
  affinity_files:
    - "data/train.csv"
    - "data/valid.csv"
    - "data/test.csv"
  default_bond_length: 1.5
  default_bond_angle_deg: 109.5
  vdw_radii:
    H: 1.20
    C: 1.70
    N: 1.55
    O: 1.52
    F: 1.47
    P: 1.80
    S: 1.80
    Cl: 1.75
  default_vdw_radius: 1.7
  hbond_donors_smarts: '[$([N;!H0;v3,v4&+1]),$([O,S;H1;+0])]'
  hbond_acceptors_smarts: '[$([O,S;H1;v2;!$(*-*=[O,N,P,S])]),$([O,S;H0;v2]),$([O,S,N;v3;!$(*-*=[O,N,P,S])]),$([N;v3;!H0;!$(*-*=[O,N,P,S])]),$([F,Cl,Br,I;v1;!H0])]'
  pi_pi_distance_cutoff: 6.0
  ring_normal_norm_threshold: 1.0e-6

# --- 7. Dataset Splitting ---
dataset_split:
  pdbbind_dir: "data/PDBbind_v2020"
  pdbbind_index_file: "data/INDEX_general_PL_data.2020"
  casf_dir: "data/CASF_v2016"
  prepared_protein_dir: "data/processed_data/predocking"
  protein_preparation_log: "logs/protein_prep/protein_preparation.log"
  drug_preparation_log: "logs/drug_prep/drug_preparation.log"
  posebusters_ids_file: "data/PoseBusters/posebusters_benchmark_set_ids.txt"
  astex_ids_file: "data/astex_diverse_set/astex_diverse_set_ids.txt"
  output_dir: "data"
  temp_dir: "data/temp/split_temp"
  cd_hit_executable_path: "/home/zdy/anaconda3/envs/FlexPose/bin/cd-hit"
  cd_hit_identity: 0.9
  cd_hit_threads: 8
  validation_set_ratio: 0.2
  random_seed: 42

# --------------------------------
# Feature Generation for Model
# --------------------------------
backbone_graph_task:
  overwrite_existing: false
  input_dir: "data/processed_data/split"
  backbone_suffix: "_backbone.pdb"
  output_dir: "data/processed_data/graph"
  seq_len_norm_factor: 1000.0
  allowed_amino_acids: ['ALA','ARG','ASN','ASP','CYS','GLN','GLU','GLY','HIS','ILE','LEU','LYS','MET','PHE','PRO','SER','THR','TRP','TYR','VAL','UNK']
  hydrophobicity_scale: {'ALA': 1.8, 'ARG': -4.5, 'ASN': -3.5, 'ASP': -3.5, 'CYS': 2.5, 'GLN': -3.5, 'GLU': -3.5, 'GLY': -0.4, 'HIS': -3.2, 'ILE': 4.5, 'LEU': 3.8, 'LYS': -3.9, 'MET': 1.9, 'PHE': 2.8, 'PRO': -1.6, 'SER': -0.8, 'THR': -0.7, 'TRP': -0.9, 'TYR': -1.3, 'VAL': 4.2, 'UNK': 0.0}

sidechain_graph_task:
  overwrite_existing: false
  input_dir: "data/processed_data/split"
  sidechain_suffix: "_sidechain.pdb"
  backbone_suffix: "_backbone.pdb"
  output_dir: "data/processed_data/graph"
  bond_perception_scale: 1.3
  atom_symbols: ['C', 'N', 'O', 'S', 'P', 'F', 'Cl', 'Br', 'I', 'Other']
  hybridization_types: ['SP', 'SP2', 'SP3', 'SP3D', 'SP3D2', 'S', 'UNSPECIFIED', 'OTHER']
  bond_types: ['SINGLE', 'DOUBLE', 'TRIPLE', 'AROMATIC', 'UNSPECIFIED', 'OTHER']
  chi_angle_definitions:
    ARG: [['N', 'CA', 'CB', 'CG'], ['CA', 'CB', 'CG', 'CD'], ['CB', 'CG', 'CD', 'NE'], ['CG', 'CD', 'NE', 'CZ']]
    ASN: [['N', 'CA', 'CB', 'CG'], ['CA', 'CB', 'CG', 'OD1']]
    ASP: [['N', 'CA', 'CB', 'CG'], ['CA', 'CB', 'CG', 'OD1']]
    CYS: [['N', 'CA', 'CB', 'SG']]
    GLN: [['N', 'CA', 'CB', 'CG'], ['CA', 'CB', 'CG', 'CD'], ['CB', 'CG', 'CD', 'OE1']]
    GLU: [['N', 'CA', 'CB', 'CG'], ['CA', 'CB', 'CG', 'CD'], ['CB', 'CG', 'CD', 'OE1']]
    HIS: [['N', 'CA', 'CB', 'CG'], ['CA', 'CB', 'CG', 'ND1']]
    ILE: [['N', 'CA', 'CB', 'CG1'], ['CA', 'CB', 'CG1', 'CD1']]
    LEU: [['N', 'CA', 'CB', 'CG'], ['CA', 'CB', 'CG', 'CD1']]
    LYS: [['N', 'CA', 'CB', 'CG'], ['CA', 'CB', 'CG', 'CD'], ['CB', 'CG', 'CD', 'CE'], ['CG', 'CD', 'CE', 'NZ']]
    MET: [['N', 'CA', 'CB', 'CG'], ['CA', 'CB', 'CG', 'SD'], ['CB', 'CG', 'SD', 'CE']]
    PHE: [['N', 'CA', 'CB', 'CG'], ['CA', 'CB', 'CG', 'CD1']]
    PRO: [['N', 'CA', 'CB', 'CG'], ['CA', 'CB', 'CG', 'CD'], ['CB', 'CG', 'CD', 'N']]
    SER: [['N', 'CA', 'CB', 'OG']]
    THR: [['N', 'CA', 'CB', 'OG1']]
    TRP: [['N', 'CA', 'CB', 'CG'], ['CA', 'CB', 'CG', 'CD1']]
    TYR: [['N', 'CA', 'CB', 'CG'], ['CA', 'CB', 'CG', 'CD1']]
    VAL: [['N', 'CA', 'CB', 'CG1']]

drug_graph_task:
  overwrite_existing: false
  input_dir: "data/processed_data/split"
  ligand_suffix: "_ligand.sdf"
  output_dir: "data/processed_data/graph"
  atom_symbols: ['C', 'N', 'O', 'S', 'P', 'F', 'Cl', 'Br', 'I', 'H', 'Other']
  hybridization_types: ['SP', 'SP2', 'SP3', 'SP3D', 'SP3D2', 'S', 'UNSPECIFIED', 'OTHER']
  chiral_tags: ['CHI_UNSPECIFIED', 'CHI_TETRAHEDRAL_CW', 'CHI_TETRAHEDRAL_CCW', 'CHI_OTHER']
  bond_types: ['SINGLE', 'DOUBLE', 'TRIPLE', 'AROMATIC', 'UNSPECIFIED', 'OTHER']

# --------------------------------
# Model Architecture Configuration
# --------------------------------
backbone_encoder_params:
  num_layers: 4
  l_max_sh: 2
  differentiable_sh: true
  mlp_hidden_dims: [128, 128]
  mlp_activation: "ReLU"
  mlp_use_batch_norm: false

sidechain_encoder_params:
  num_layers: 4
  l_max_sh: 2
  differentiable_sh: true
  mlp_hidden_dims: [128, 128]
  mlp_activation: "ReLU"
  mlp_use_batch_norm: false

drug_encoder_params:
  num_layers: 4
  l_max_sh: 2
  differentiable_sh: true
  mlp_hidden_dims: [128, 128]
  mlp_activation: "ReLU"
  mlp_use_batch_norm: false

interaction_params:
  embed_dim: 128
  num_heads: 4
  mlp_hidden_dims: [512]
  mlp_activation: "ReLU"

diffusion_params:
  embed_dim: 128
  num_timesteps: 50
  schedule_type: 'linear'
  beta_start: 0.0001
  beta_end: 0.02
  denoiser_mlp:
    hidden_dims: [512, 512]
    time_embed_dim: 128

decoder_params:
  embed_dim: 128
  num_layers: 6
  num_heads: 4
  rbf:
    num_kernels: 16
    d_max: 20.0
  message_mlp:
    hidden_dims: [128, 128]
  coord_weight_mlp:
    hidden_dims: [128]

model_params:
  num_atom_types: 100
  predict_affinity: true
  affinity_mlp_hidden_dims: [128, 64]
  noise_mlp_hidden_dims: [128]

# --------------------------------
# Data Loading & Loss Configuration
# --------------------------------
data_loading:
  labels_dir: "data/processed_data/label"
  train_split_file: "data/train.csv"
  val_split_file: "data/valid.csv"
  test_sets:
    - name: "PDBbind_Core_Set"
      path: "data/test.csv"
    - name: "PoseBusters_Benchmark"
      path: "data/posebusters.csv"

total_loss:
  weight_strategy: "dynamic"
  static_weights:
    L_noise: 1.0
    L_structure: 1.0
    L_phy_geo: 1.0
  dynamic_weights:
    epsilon: 1.0e-8
    smoothing_factor: 0.1
  params:
    electrostatic:
      smoothing_delta: 0.1
      dielectric_constant: 4.0
      C_unit_conv: 332.0637
    hbond:
      dist_min: 2.5;
      dist_max: 3.5
      angle_min_deg: 120.0;
      angle_max_deg: 180.0
    pi_pi:
      dist_min: 3.2;
      dist_max: 5.5
      angle_max_deg: 30.0
      disp_max: 2.0
      alignment_dist_gate: 4.0

# --------------------------------
# Training Configuration
# --------------------------------
training:
  epochs: 100
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 1.0e-5
  num_workers: 4
  device: "cuda"
  seed: 42
  checkpoint_dir: "checkpoints"
  log_every_n_steps: 50
  validate_every_n_epochs: 1

# --------------------------
# Tool & Logging Configuration
# --------------------------
mgltools:
  pythonsh_path: "mgltools_x86_64Linux2_1.5.7/bin/pythonsh"
  prepare_receptor_path: "mgltools_x86_64Linux2_1.5.7/MGLToolsPckgs/AutoDockTools/Utilities24/prepare_receptor4.py"
  prepare_ligand_path: "mgltools_x86_64Linux2_1.5.7/MGLToolsPckgs/AutoDockTools/Utilities24/prepare_ligand4.py"

vina_settings:
  executable: '/home/zdy/anaconda3/envs/FlexPose/bin/vina'
  center_x: 0.0
  center_y: 0.0
  center_z: 0.0
  size_x: 25.0
  size_y: 25.0
  size_z: 25.0
  exhaustiveness: 16
  num_modes: 3
  energy_range: 3.0
  random_seed: 42
  use_gpu: false
  gpu_device_id: 0
  cpu_threads: 1

# --------------------------------
# Testing Configuration
# --------------------------------
testing:
  checkpoint_path: "checkpoints/train_20250417_112233/best_model_epoch_85.pt"
  batch_size: 16
  test_on_sets: []

logging:
  protein_prep:
    log_dir: 'logs/protein_prep'
    log_base_name: 'protein_preparation'
    log_level: 'INFO'
    use_timestamp_in_log_name: true
  drug_prep:
    log_dir: 'logs/drug_prep'
    log_base_name: 'drug_preparation'
    log_level: 'INFO'
    use_timestamp_in_log_name: true
  docking_log:
    log_dir: 'logs/docking'
    log_base_name: 'docking'
    log_level: 'INFO'
    use_timestamp_in_log_name: true
  split_log:
    log_dir: 'logs/split'
    log_base_name: 'split'
    log_level: 'INFO'
    use_timestamp_in_log_name: true
  lj_generate_log:
    log_dir: 'logs/lj_generate'
    log_base_name: 'LJ_generate'
    log_level: 'INFO'
    use_timestamp_in_log_name: true
  phy_geo_log:
    log_dir: 'logs/phy_geo'
    log_base_name: 'phy_geo'
    log_level: 'INFO'
    use_timestamp_in_log_name: true
  split_dataset:
    log_dir: 'logs/split_dataset'
    log_base_name: 'split_dataset'
    log_level: 'INFO'
    use_timestamp_in_log_name: true
  backbone_graph_log:
    log_dir: 'logs/backbone_graph'
    log_base_name: 'backbone_graph'
    log_level: 'INFO'
    use_timestamp_in_log_name: true
  sidechain_graph_log:
    log_dir: 'logs/sidechain_graph'
    log_base_name: 'sidechain_graph'
    log_level: 'INFO'
    use_timestamp_in_log_name: true
  drug_graph_log:
    log_dir: 'logs/drug_graph'
    log_base_name: 'drug_graph'
    log_level: 'INFO'
    use_timestamp_in_log_name: true
  training_log:
    log_level: "INFO"
    log_dir: "logs/training"
    log_base_name: "train"
    use_timestamp_in_log_name: true